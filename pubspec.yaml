name: psg
description: PlayStation Go - PSG Emulator
version: 1.0.0+1
publish_to: none

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^2.24.0
  firebase_auth: ^4.15.0
  cloud_firestore: ^4.13.0
  google_sign_in: ^6.1.6
  flutter_blue_plus: 1.34.0
  audioplayers: ^5.2.1
  file_picker: ^6.1.1
  path_provider: ^2.1.2
  permission_handler: ^11.1.0
  http: ^1.1.0
  dio: ^5.4.0
  shared_preferences: ^2.2.2
  provider: ^6.1.1
  cached_network_image: ^3.3.0
  wakelock_plus: ^1.1.4
  connectivity_plus: ^5.0.2
  flutter_secure_storage: ^9.0.0
  google_fonts: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
    - assets/images/
