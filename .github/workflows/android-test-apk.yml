name: Publish Android test APK

on:
  push:
    branches:
      - main
      - fix/android-release-build
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.19.0"
          channel: stable
          cache: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-34 build-tools;34.0.0 ndk;25.2.9519653 cmake;3.22.1
          accept-android-sdk-licenses: true

      - name: Build installable ARM64 test APK
        run: |
          flutter pub get
          flutter build apk --debug --target-platform android-arm64

      - name: Publish APK to the Android test release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          asset="build/app/outputs/flutter-apk/app-debug.apk"
          tag="android-test-build"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$asset" --clobber
          else
            gh release create "$tag" "$asset" \
              --title "Android Test Build" \
              --notes "Debug-signed ARM64 APK for device testing. This build does not include emulator cores and is not a production release." \
              --prerelease \
              --latest=false
          fi
